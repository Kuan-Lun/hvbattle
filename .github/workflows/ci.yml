name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release tooling
        run: >-
          python -m pip install
          "build==1.5.0"
          "check-wheel-contents==0.6.3"
          "twine==7.0.0"

      - name: Install project
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir --editable ".[dev]"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Check formatting and lint
        run: |
          python -m black --check src/hvbattle tests
          python -m ruff check src/hvbattle tests

      - name: Check types
        run: python -m mypy src/hvbattle

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
