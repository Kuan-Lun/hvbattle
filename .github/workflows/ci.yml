name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install --no-cache-dir --editable ".[dev]"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 30
          done

      # Local hooks and scripts own lint, formatting, typing, formal-model, and
      # distribution checks. This lane keeps only the Linux-specific test signal.
      - name: Run Linux compatibility tests
        run: python -m pytest
