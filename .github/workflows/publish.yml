name: Publish to PyPI

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install version checker
        run: python -m pip install packaging

      - name: Check version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          CURRENT=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if git cat-file -e "${BEFORE_SHA}:pyproject.toml" 2>/dev/null; then
            PREVIOUS=$(git show "${BEFORE_SHA}:pyproject.toml" | python -c "
          import tomllib, sys
          print(tomllib.load(sys.stdin.buffer)['project']['version'])
            ")
          else
            PREVIOUS=""
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [ -z "$PREVIOUS" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" != "$PREVIOUS" ]; then
            python -c "
          from packaging.version import Version
          current, previous = Version('$CURRENT'), Version('$PREVIOUS')
          exit(0 if current > previous else 1)
          "
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install project and build tooling
        if: steps.version.outputs.bumped == 'true'
        run: |
          python -m pip install --upgrade build
          for attempt in 1 2 3 4 5; do
            if python -m pip install --editable ".[dev]"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Check formatting and lint
        if: steps.version.outputs.bumped == 'true'
        run: |
          python -m black --check src/hvbattle tests
          python -m ruff check src/hvbattle tests

      - name: Check types
        if: steps.version.outputs.bumped == 'true'
        run: python -m mypy src/hvbattle

      - name: Run tests
        if: steps.version.outputs.bumped == 'true'
        run: python -m pytest

      - name: Build distributions
        if: steps.version.outputs.bumped == 'true'
        run: python -m build

      - name: Publish
        if: steps.version.outputs.bumped == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
