name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - pyproject.toml
      - src/**
      - tests/**

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: >-
          python -m pip install
          "build==1.5.0"
          "check-wheel-contents==0.6.3"
          "packaging==26.3"
          "twine==7.0.0"

      - name: Check whether this version is unpublished
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          import urllib.error
          import urllib.request

          from packaging.version import Version

          with open("pyproject.toml", "rb") as project_file:
              current = Version(tomllib.load(project_file)["project"]["version"])

          release_url = f"https://pypi.org/pypi/hvbattle/{current}/json"
          try:
              urllib.request.urlopen(release_url, timeout=30).close()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              print(f"current={current}")
              print("publish=false")
              raise SystemExit

          with urllib.request.urlopen(
              "https://pypi.org/pypi/hvbattle/json",
              timeout=30,
          ) as response:
              published = Version(json.load(response)["info"]["version"])

          if current <= published:
              raise SystemExit(
                  f"Unpublished version {current} must exceed latest release {published}"
              )

          print(f"current={current}")
          print(f"published={published}")
          print("publish=true")
          PY

      - name: Build distributions
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          attestations: false
