[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "hvbattle"
version = "0.11.4"
description = "Reusable battle-domain APIs for HentaiVerse."
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,!=3.14.1,<3.15"
dependencies = [
    "hvbrowser>=0.9.2,<0.10",
    "hv-bie>=0.7.2,<0.8",
    "ponychart-classifier>=0.12.1,<0.13",
    "zendriver>=0.16.0,<0.17",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "pymarkdownlnt>=0.9.39",
    "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/hvbattle"
Tracker = "https://github.com/Kuan-Lun/hvbattle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hvbattle"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src", "/tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-ignore = ["E203", "E226", "E501"]
