[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hvbattle"
version = "0.14.1"
description = "Reusable battle-domain APIs for HentaiVerse."
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# The runtime suite passes on CPython 3.14.1, but standard pip resolution is
# blocked while the direct ponychart-classifier dependency publishes the same
# Requires-Python exclusion. Provenance:
# https://github.com/Kuan-Lun/ponychart-classifier/commit/557f4180c6f79798210e37f5bd786a36837f9d81
requires-python = ">=3.14,!=3.14.1"
dependencies = [
    "hvbrowser>=0.9.7,<0.10",
    "hv-bie>=0.7.3,<0.8",
    "ponychart-classifier>=0.14.1,<0.15",
    "zendriver>=0.16.0,<0.17",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "packaging>=26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/hvbattle"
Tracker = "https://github.com/Kuan-Lun/hvbattle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hvbattle"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src", "/tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]
# Traditional Chinese prose legitimately uses full-width punctuation. SIM
# rewrites are advisory and can obscure lifecycle/safety sequencing whose
# lexical order is audited.
ignore = ["RUF001", "RUF002", "RUF003", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded JavaScript regular-expression literals must remain physically
# contiguous; wrapping them would change the browser-side program.
"src/hvbattle/battle_launcher.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["src/hvbattle"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["hv_bie.*", "ponychart_classifier.*", "zendriver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.h2h.version]
release-paths = ["LICENSE", "formal/**", "src/**"]
